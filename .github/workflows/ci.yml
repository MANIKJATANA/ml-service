name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, type-check, layering invariant, and the test suite. Runs on Linux so
  # the Linux-only heavy deps (insightface/decord) are installed and exercised;
  # the gated model/DB/Redis tests skip without those backends present.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # opencv (pulled in transitively via insightface) dlopens libGL at import.
      - name: Install system libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (types)
        run: uv run mypy .

      # Layering invariant (architecture §5): the pure layers import no concrete
      # ML/IO lib. Also covered by tests/test_layering.py; kept here as a fast,
      # dependency-free gate that fails the build loudly.
      - name: Layering invariant
        run: |
          if grep -rn "import faiss\|import cv2\|import insightface\|import boto3" \
              services/ml_service/src/ml_service/domain \
              services/ml_service/src/ml_service/orchestration; then
            echo "::error::Concrete ML/IO import found in an ML pure layer" && exit 1
          fi
          # Backend pure layers (decisions/0022): no concrete IO lib in domain/services.
          # tests/test_layering.py is the thorough AST gate; this mirrors scripts/check.ps1.
          if grep -rnE "(from|import)\s+(sqlalchemy|asyncpg|redis|httpx|supabase|storage3|pydantic|fastapi|passlib|jwt|argon2)" \
              services/backend/src/backend/domain \
              services/backend/src/backend/services; then
            echo "::error::Concrete IO import found in a backend pure layer" && exit 1
          fi

      - name: Pytest
        run: uv run pytest

  # Gated DB/Redis tests against real backends. These skip in `check` (no DB there);
  # here they exercise the Postgres repositories, the Phase-6 ML-results reader, and
  # the matches contract test against live Postgres. Applying both Alembic chains first
  # is an apply-and-coexist smoke (the first CI run of `alembic upgrade head`, proving
  # the two chains coexist in one DB via distinct version tables). We then RESET the
  # schema to empty before pytest: the gated fixtures self-provision via
  # `Base.metadata.{create,drop}_all` and assume an empty DB, but the ML migration's
  # `student_media_appearances` view depends on the detection tables and would block
  # `drop_all` in the repo-test teardown. The reset makes the gated tests genuinely
  # independent of the migrated schema.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BE_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      ML_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      BE_TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      ML_TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      ML_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # libgl/glib for OpenCV; postgresql-client (psql) for the schema reset below.
      - name: Install system libs (OpenCV + psql)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 postgresql-client

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Apply backend migrations
        run: uv run alembic -c services/backend/alembic.ini upgrade head

      - name: Apply ML migrations
        run: uv run alembic -c services/ml_service/alembic.ini upgrade head

      # Reset to an empty schema so the gated fixtures (Base.metadata.{create,drop}_all,
      # which assume an empty DB) aren't blocked by the migration-created
      # student_media_appearances view. The apply above already served as the smoke.
      - name: Reset public schema (gated tests self-provision on a clean DB)
        env:
          PGPASSWORD: app
        run: psql -h localhost -U app -d app -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Pytest (gated DB/Redis tests active)
        run: uv run pytest

  # Prove both deployment images build (ml-service bakes buffalo_l). No push.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ml-service image
        run: docker build -f services/ml_service/Dockerfile -t ml-service:ci .
      - name: Build backend image
        run: docker build -f services/backend/Dockerfile -t backend:ci .
