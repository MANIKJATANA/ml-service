# Local dev orchestration for the 3 app images + backing services.
# Build contexts: Python images build from the repo root (uv workspace);
# the frontend builds from ./frontend.
#
# The ML service image runs in three roles (API / worker / migrate) selected by
# `command`; all three share one `image:` tag so it is built only once.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: backend:local
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      BE_ML_SERVICE_URL: http://ml-service:8000
      BE_DATABASE_URL: ${BE_DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/app}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully

  # One-shot: apply pending backend DB migrations, then exit. The backend waits for
  # this to finish successfully before starting. Own Alembic chain (version table
  # alembic_version_backend) so it coexists with the ML `migrate` in the same DB.
  backend-migrate:
    image: backend:local
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    command: ["alembic", "-c", "services/backend/alembic.ini", "upgrade", "head"]
    environment:
      BE_DATABASE_URL: ${BE_DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: apply pending ML DB migrations, then exit. The app services wait
  # for this to finish successfully before starting (see their depends_on).
  migrate:
    image: ml-service:local
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    command: ["alembic", "-c", "services/ml_service/alembic.ini", "upgrade", "head"]
    environment:
      ML_DATABASE_URL: ${ML_DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Shared env for the API + worker (they run the same image, same config).
  ml-service:
    image: ml-service:local
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    # Inject the whole .env into the container so ANY ML_* setting (thresholds,
    # top_k, fps, …) takes effect from .env — compose's ${VAR} substitution only
    # covers the vars listed below, not the rest. `environment:` still wins for
    # the vars it names. Optional so the stack also runs with no .env present.
    env_file:
      - path: .env
        required: false
    environment: &ml-env
      ML_DATABASE_URL: ${ML_DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/app}
      ML_REDIS_URL: ${ML_REDIS_URL:-redis://redis:6379/0}
      # Supabase MediaStore (key is a secret — set it in .env, never committed).
      ML_SUPABASE_URL: ${ML_SUPABASE_URL:-}
      ML_SUPABASE_KEY: ${ML_SUPABASE_KEY:-}
      ML_SUPABASE_BUCKET: ${ML_SUPABASE_BUCKET:-media}
      ML_MODEL_DIR: ${ML_MODEL_DIR:-/models/buffalo_l}
      # Adapter selectors (NFR-1/2). Defaults are the prod adapters; override in
      # .env for a self-contained offline run, e.g. ML_MEDIA_STORE_IMPL=local_fs
      # ML_VIDEO_EXTRACTOR_IMPL=opencv ML_QUEUE_IMPL=redis (queue stays Redis here).
      ML_MEDIA_STORE_IMPL: ${ML_MEDIA_STORE_IMPL:-supabase}
      ML_INDEX_STORE_IMPL: ${ML_INDEX_STORE_IMPL:-local_fs}
      ML_VIDEO_EXTRACTOR_IMPL: ${ML_VIDEO_EXTRACTOR_IMPL:-decord}
      # FAISS index files live on a volume shared by the API (writes on enroll)
      # and the worker (reads on inference) — see docs/06-faiss-lifecycle.md.
      ML_INDEX_STORE_DIR: /var/lib/ml-service/faiss
      ML_MEDIA_DIR: /var/lib/ml-service/media
      # Dev-only browser test UI at GET /test (enroll + identify). On for local.
      ML_ENABLE_TEST_UI: ${ML_ENABLE_TEST_UI:-true}
      # Observability: set an OTLP endpoint to enable tracing (off by default).
      ML_LOG_JSON: ${ML_LOG_JSON:-true}
      ML_OTEL_EXPORTER_OTLP_ENDPOINT: ${ML_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - faiss:/var/lib/ml-service/faiss
      - media:/var/lib/ml-service/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Inference worker: same image, consume/ack/nack loop instead of the API.
  ml-worker:
    image: ml-service:local
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    command: ["python", "-m", "ml_service.workers.inference_worker"]
    env_file:
      - path: .env
        required: false
    environment: *ml-env
    volumes:
      - faiss:/var/lib/ml-service/faiss
      - media:/var/lib/ml-service/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  faiss:
  media:
