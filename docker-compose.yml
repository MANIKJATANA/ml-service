# Local dev orchestration for the 3 app images + backing services.
# Build contexts: Python images build from the repo root (uv workspace);
# the frontend builds from ./frontend.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000   # TEMP (wiring demo) — server-side proxy target
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment:
      BE_ML_SERVICE_URL: http://ml-service:8000
      # TEMP (wiring demo)
      ML_SERVICE_URL: http://ml-service:8000
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started

  # One-shot: apply pending ML DB migrations, then exit. The app services wait
  # for this to finish successfully before starting (see their depends_on).
  migrate:
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    command: ["alembic", "-c", "services/ml_service/alembic.ini", "upgrade", "head"]
    environment:
      ML_DATABASE_URL: ${ML_DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ml-service:
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    environment:
      ML_DATABASE_URL: ${ML_DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/app}
      ML_REDIS_URL: ${ML_REDIS_URL:-redis://redis:6379/0}
      # Supabase (used from Phase 3). ML_SUPABASE_KEY is a secret — set it in .env.
      ML_SUPABASE_URL: ${ML_SUPABASE_URL:-}
      ML_SUPABASE_KEY: ${ML_SUPABASE_KEY:-}
      ML_SUPABASE_BUCKET: ${ML_SUPABASE_BUCKET:-media}
      ML_MODEL_DIR: ${ML_MODEL_DIR:-/models/buffalo_l}
      # TEMP (wiring demo)
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
