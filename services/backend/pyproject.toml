[project]
name = "backend"
version = "0.1.0"
description = "Core system API: uploads, storage, notifications, distribution; drives the ML service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Phase 1 (decisions/0023): DB layer + own Alembic chain + structured logging.
    # alembic is a runtime dep — the image runs `alembic upgrade head` at deploy.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    # Phase 2 (decisions/0024): roll-our-own JWT auth + RBAC.
    "passlib[argon2]>=1.7",
    "pyjwt>=2.9",
    "email-validator>=2.1",
    # Phase 4 (decisions/0026): ML enrollment client (httpx) + reference-photo
    # signed upload URLs (supabase). Both cross-platform.
    "httpx>=0.27",
    "supabase>=2.0",
    # Phase 5 (decisions/0027): Redis Streams job producer (enqueue inference jobs).
    "redis>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
