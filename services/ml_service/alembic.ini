# Alembic config for the ML-service metadata DB.
# The DB URL is NOT stored here — env.py reads it from ML_DATABASE_URL
# (postgresql+asyncpg://...) so no secrets live in the repo.
[alembic]
# %(here)s = the directory of this ini file, so it works from any CWD.
script_location = %(here)s/src/ml_service/db/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# Migration filenames: 0001_slug.py (see env.py for revision generation).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
