[project]
name = "ml-service"
version = "0.1.0"
description = "Photo-distribution ML service: face enrollment + inference (hexagonal)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # TEMP (wiring demo) — Redis consumer + Postgres writes. Remove with demo.
    "redis>=5.0",
    "psycopg[binary]>=3.2",
]
# Heavy adapter deps (faiss-cpu, insightface, decord, redis, sqlalchemy, azure-*)
# are added incrementally as each adapter is implemented — see architecture §6.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_service"]
