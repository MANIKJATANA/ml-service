[project]
name = "ml-service"
version = "0.1.0"
description = "Photo-distribution ML service: face enrollment + inference (hexagonal)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # multipart/form-data uploads (test UI file upload)
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # --- Phase 2 real adapters (architecture §6) ---
    "numpy>=1.26",
    "faiss-cpu>=1.8",           # VectorIndex: IndexFlatIP per school
    "onnxruntime>=1.17",        # InsightFace ONNX runtime (CPU); GPU = onnxruntime-gpu
    "opencv-python-headless>=4.9",  # image decode + OpenCV video-frame fallback
    "supabase>=2.4",            # default MediaStore + FAISS index store (Storage)
    "httpx>=0.27",              # MediaStore fetch of http(s) URIs
    "sqlalchemy[asyncio]>=2.0", # Postgres repositories (async)
    "asyncpg>=0.29",            # async Postgres driver (also used by Alembic env)
    "alembic>=1.13",            # DB migrations
    "redis>=5.0",               # JobQueue: Redis Streams (now a real adapter dep)
    "anyio>=4.4",               # offload sync ML/IO work to threads inside adapters
    # Linux-only heavy deps: no prebuilt Windows/py312 wheels. They run in the
    # (Linux) Docker image; local Windows dev uses the OpenCV extractor + gated
    # tests instead. See decisions/0010.
    "insightface>=0.7.3; sys_platform == 'linux'",  # SCRFD detector + ArcFace embedder (buffalo_l)
    "decord>=0.6; sys_platform == 'linux'",          # default VideoFrameExtractor
    # --- Phase 4 observability (requirements §13, architecture §11) ---
    "prometheus-client>=0.20",  # /metrics counters + latency histogram
    "structlog>=24.1",          # structured JSON logging
    "opentelemetry-sdk>=1.25",  # tracing (opt-in via ML_OTEL_EXPORTER_OTLP_ENDPOINT)
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_service"]
